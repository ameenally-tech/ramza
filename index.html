<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ramza — the Islamic guessing game</title>
<meta name="description" content="Hold the phone to your forehead, your friends give clues, and guess as many as you can before the time runs out.">
<meta name="theme-color" content="#F2F1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ramza">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F1EC; --card:#FFFFFF; --ink:#15161A; --dim:#5C5E66; --faint:#8E9098;
  --line:#E4E3DC; --teal:#0E6F63; --teal-dark:#0A5248; --pass:#B4611F;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  -webkit-user-select:none;user-select:none;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ar{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:flex}

/* ---------- home ---------- */
#home{padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-bottom:28px}
.brand{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.brand h1{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.brand .ar{font-size:19px;color:var(--teal)}
.tag{font-size:13.5px;color:var(--dim);margin-top:9px;line-height:1.5}
.lbl{font-size:10px;font-weight:700;letter-spacing:.17em;color:var(--dim);margin:26px 0 9px}
.seg{display:flex;gap:5px;padding:4px;background:#E3E2DB;border-radius:13px;width:max-content}
.seg button{font-size:14px;font-weight:500;padding:9px 20px;border-radius:9px;color:#3D3F45}
.seg button[aria-pressed="true"]{background:#fff;color:var(--teal);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 15px;border-bottom:1px solid var(--line);text-align:left;min-height:56px}
.row:last-child{border-bottom:0}
.row:active{background:#F4F3EE}
.chip{flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.chip svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rname{flex:1;min-width:0;font-size:15px;font-weight:600}
.rmeta{font-size:12.5px;color:var(--dim);white-space:nowrap}
.chev{flex:0 0 auto;width:13px;height:13px;stroke:#BFBEB7;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;font-size:12.5px;color:var(--dim)}
.link{font-weight:600;color:var(--teal)}
.banner{display:flex;align-items:center;gap:12px;background:#E3F0ED;border:1px solid #BFDCD6;border-radius:13px;padding:12px 14px;margin-top:16px;font-size:13.5px}
.banner p{flex:1;line-height:1.4}
.banner button{background:var(--teal);color:#fff;font-size:13px;font-weight:600;padding:8px 15px;border-radius:9px}
.note{margin-top:16px;font-size:12.5px;color:var(--dim);line-height:1.5}
.fs{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:12px 14px;
    background:var(--card);border-radius:13px;font-size:13px;color:var(--dim);text-align:left}
.fs b{color:var(--teal)}
.fs svg{flex:0 0 17px;width:17px;height:17px;stroke:var(--teal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ssteps{margin-top:14px;padding-left:20px}
#ssteps li{font-size:15px;line-height:1.55;margin-bottom:9px}
#ssteps li b{font-weight:600}
.shead{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--dim);margin-top:20px}

/* ---------- play ---------- */
#play{background:var(--teal);color:#fff;align-items:center;justify-content:center;overflow:hidden;transition:background .14s}
body.flash-ok #play{background:#127A3E}
body.flash-no #play{background:var(--pass)}
/* Holding the phone sideways is the whole game. If the browser still reports
   portrait (rotation lock), turn the stage instead — iOS Safari cannot lock. */
#stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:22px 44px}
@media (orientation:portrait){
  #stage{width:100vh;height:100vw;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg)}
}
.word{font-size:clamp(40px,10.5vmin,86px);font-weight:700;letter-spacing:-.03em;line-height:1.04;text-align:center}
.big{font-size:clamp(34px,8vmin,60px);font-weight:700;text-align:center;line-height:1.15}
.sub{font-size:clamp(14px,2.6vmin,19px);opacity:.78;text-align:center;margin-top:12px}
.count{font-size:clamp(90px,26vmin,190px);font-weight:700;line-height:1}
#hud{position:absolute;inset:0;pointer-events:none}
#hud .bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
#quit{pointer-events:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
#quit svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
#clock{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;opacity:.85}
#taps{position:absolute;inset:0;display:none}
#taps div{flex:1}
body.taps #taps{display:flex}

/* ---------- results ---------- */
#results{padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
.score{font-size:70px;font-weight:700;color:var(--teal);line-height:1;text-align:center;margin-top:8px}
.scap{text-align:center;color:var(--dim);font-size:13.5px;margin-top:6px}
.best{display:block;text-align:center;color:#B4611F;font-weight:600;font-size:13px;margin-top:8px}
.bar2{display:flex;gap:10px;margin-top:18px}
.bar2 button{flex:1;padding:14px;border-radius:13px;font-size:15px;font-weight:700}
.primary{background:var(--teal);color:#fff}
.ghost{border:1px solid #CFCEC6;color:var(--ink)}
.mk{flex:0 0 auto;width:17px;height:17px;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;background:rgba(20,20,22,.45);display:none;align-items:flex-end;z-index:20}
#sheet.on{display:flex}
#sheetbox{background:var(--card);width:100%;max-height:82%;overflow-y:auto;border-radius:20px 20px 0 0;padding:24px 22px max(24px,env(safe-area-inset-bottom))}
#sheetbox h3{font-size:21px;font-weight:700;margin-bottom:11px}
#sheetbox p{font-size:15.5px;line-height:1.62}
#sheetbox .clues{margin-top:13px;font-size:13px;color:var(--dim)}
#sheetbox button{margin-top:20px;width:100%;padding:14px;border-radius:13px;background:var(--teal);color:#fff;font-weight:700}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<section class="screen on" id="home">
  <div class="wrap">
    <div class="brand"><h1>Ramza</h1><span class="ar">رَمْزًا</span></div>
    <p class="tag">Hold the phone sideways against your forehead. Your friends give the clues — tilt <b>down</b> when you get it, tilt <b>up</b> to pass.</p>

    <div id="banner" class="banner hidden">
      <p id="bannertext"></p>
      <button type="button" id="dobtn">Update</button>
    </div>

    <div class="lbl">ROUND</div>
    <div class="seg" id="seg">
      <button type="button" data-t="60">60s</button>
      <button type="button" data-t="90">90s</button>
      <button type="button" data-t="120">120s</button>
    </div>

    <div class="lbl">DECKS</div>
    <div class="list" id="decks"></div>

    <div class="foot">
      <span id="version">Loading cards…</span>
      <button type="button" class="link" id="check">Check for new cards</button>
    </div>
    <button type="button" class="fs" id="fshelp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5"/><path d="M15 20h5v-5"/><path d="M4 4l6 6"/><path d="M20 20l-6-6"/></svg>
      <span>Best played in full screen — <b>show me how</b></span>
    </button>
  </div>
</section>

<!-- ===== PLAY ===== -->
<section class="screen" id="play">
  <div id="stage"><div id="stagebody"></div></div>
  <div id="hud">
    <div class="bar">
      <button type="button" id="quit" aria-label="End round">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
      <span id="clock"></span>
    </div>
  </div>
  <div id="taps"><div id="tapno"></div><div id="tapok"></div></div>
</section>

<!-- ===== RESULTS ===== -->
<section class="screen" id="results">
  <div class="wrap">
    <div class="score" id="fscore">0</div>
    <div class="scap" id="fcap"></div>
    <span class="best hidden" id="fbest">New best</span>
    <div class="bar2">
      <button type="button" class="primary" id="again">Play again</button>
      <button type="button" class="ghost" id="back">Decks</button>
    </div>
    <div class="lbl">THIS ROUND</div>
    <div class="list" id="rlist"></div>
    <p class="note">Tap any card to read about it.</p>
  </div>
</section>

<div id="sheet">
  <div id="sheetbox">
    <h3 id="sword"></h3>
    <p id="sinfo"></p>
    <div id="ssteps" class="hidden"></div>
    <div class="clues" id="sclues"></div>
    <button type="button" id="sclose">Done</button>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const KEY_DECK = "ramza.deck", KEY_BEST = "ramza.best", KEY_LEN = "ramza.len";

const ICONS = {
  Mixed:   ["M3 7h5l8 10h5", "M3 17h5l8-10h5", "#6E6E76"],
  Seerah:  ["M17 4a8 8 0 1 0 3 9 6.5 6.5 0 0 1-3-9Z", "M6.6 5.4l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8L4 8l1.8-.8Z", "#0E6F63"],
  "Shamaa'il": ["M12 3.4l2 4.6 4.6 2-4.6 2-2 4.6-2-4.6-4.6-2 4.6-2Z", "", "#B5732A"],
  Fiqh:    ["M12 3.2s6 6.2 6 10a6 6 0 0 1-12 0c0-3.8 6-10 6-10Z", "", "#2D6099"],
  Hadith:  ["M9.5 7H5v5h4.5l-2 5", "M19 7h-4.5v5H19l-2 5", "#8A5A3B"],
  "Qur'an":["M4 5.6A2.6 2.6 0 0 1 6.6 3H20v13.4H6.6A2.6 2.6 0 0 0 4 19Z", "M4 19a2.6 2.6 0 0 1 2.6-2.6H20V21H6.6A2.6 2.6 0 0 1 4 19Z", "#4C4B9E"],
  Names:   ["M9.4 11.2a3.3 3.3 0 1 0 0-6.6 3.3 3.3 0 0 0 0 6.6Z", "M3.4 19.2c0-3.1 2.7-5.2 6-5.2s6 2.1 6 5.2", "#7A3E8C"]
};

const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch (e) { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let deckFile = null;              // {version, updated, decks:[...]}
let roundLen = store.get(KEY_LEN, 60);
let best = store.get(KEY_BEST, {});
let motionOK = false, motionAsked = false;

/* ---------------- cards ---------------- */
function allDecks() {
  if (!deckFile) return [];
  const mixed = { name: "Mixed", subtitle: "A bit of everything",
                  cards: deckFile.decks.reduce((a, d) => a.concat(d.cards), []) };
  return [mixed].concat(deckFile.decks);
}
function cardCount() { return deckFile ? deckFile.decks.reduce((n, d) => n + d.cards.length, 0) : 0; }

async function loadCards() {
  const cached = store.get(KEY_DECK, null);
  if (cached && cached.decks) { deckFile = cached; paint(); }
  if (!deckFile) {
    try {
      const r = await fetch("cards.json", { cache: "no-store" });
      if (!r.ok) throw new Error("http " + r.status);
      deckFile = await r.json();
      store.set(KEY_DECK, deckFile);
      paint();
    } catch (e) {
      $("version").textContent = "Couldn't load the cards — check your connection and reload.";
      return;
    }
  }
  checkUpdate(false);
}

async function checkUpdate(loud) {
  try {
    const r = await fetch("manifest.json", { cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    const m = await r.json();
    if (deckFile && m.version > deckFile.version) {
      const extra = (m.cardCount || 0) - cardCount();
      const what = extra > 0 ? extra + " new card" + (extra === 1 ? "" : "s") : "Updated cards";
      $("bannertext").textContent = what + " available." + (m.note ? " " + m.note : "");
      $("banner").classList.remove("hidden");
    } else if (loud) {
      $("version").textContent = cardCount() + " cards · you're up to date";
    }
  } catch (e) {
    if (loud) $("version").textContent = cardCount() + " cards · couldn't reach the card list";
  }
}

async function doUpdate() {
  $("dobtn").textContent = "…";
  try {
    const r = await fetch("cards.json", { cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    deckFile = await r.json();
    store.set(KEY_DECK, deckFile);
    $("banner").classList.add("hidden");
    paint();
  } catch (e) {
    $("bannertext").textContent = "Download failed — try again in a moment.";
  }
  $("dobtn").textContent = "Update";
}

/* ---------------- home ---------------- */
function paint() {
  const box = $("decks");
  box.textContent = "";
  allDecks().forEach((d) => {
    const ic = ICONS[d.name] || ["M12 3v18", "", "#6E6E76"];
    const b = document.createElement("button");
    b.type = "button"; b.className = "row";
    const chip = document.createElement("span");
    chip.className = "chip"; chip.style.background = ic[2];
    chip.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + ic[0] + '"/><path d="' + ic[1] + '"/></svg>';
    const nm = document.createElement("span");
    nm.className = "rname"; nm.textContent = d.name;
    const mt = document.createElement("span");
    mt.className = "rmeta";
    mt.textContent = d.cards.length + " cards" + (best[d.name] ? " · best " + best[d.name] : "");
    const cv = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    cv.setAttribute("viewBox", "0 0 24 24"); cv.setAttribute("class", "chev");
    cv.innerHTML = '<path d="M9 5l7 7-7 7"/>';
    b.append(chip, nm, mt, cv);
    b.addEventListener("click", () => startRound(d));
    box.appendChild(b);
  });
  $("version").textContent = cardCount() + " cards · deck v" + (deckFile ? deckFile.version : "?");
}

function paintSeg() {
  [].forEach.call($("seg").children, (b) =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.t) === roundLen)));
}
$("seg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  roundLen = Number(b.dataset.t); store.set(KEY_LEN, roundLen); paintSeg();
});
$("check").addEventListener("click", () => checkUpdate(true));
$("dobtn").addEventListener("click", doUpdate);

/* ---------------- sound ---------------- */
let actx = null;
function beep(up) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine";
    o.frequency.value = up ? 780 : 300;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.35, actx.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.22);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.24);
  } catch (e) {}
  if (navigator.vibrate) { try { navigator.vibrate(up ? 40 : [25, 40, 25]); } catch (e) {} }
}

/* ---------------- motion ---------------- */
// Signs below are as measured on a real iPhone, not as the spec reads:
//   phone sideways and upright → |nx| ≈ 1, nz ≈ 0   (the playing position)
//   screen tipped to the floor → nz → +1            (correct)
//   screen tipped to the sky   → nz → -1            (pass)
// A tilt must also be held for DWELL ms, which keeps a stray jolt from scoring.
const TRIG = 0.70, REARM = 0.32, DWELL = 90;
let nx = 0, nz = 0, haveMotion = false, tiltDir = 0, tiltSince = 0;
function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x === null) return;
  haveMotion = true;
  nx = a.x / 9.81; nz = a.z / 9.81;
}
async function askMotion() {
  if (motionAsked) return motionOK;
  motionAsked = true;
  try {
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      motionOK = (await DeviceMotionEvent.requestPermission()) === "granted";
    } else {
      motionOK = typeof DeviceMotionEvent !== "undefined";
    }
  } catch (e) { motionOK = false; }
  if (motionOK) window.addEventListener("devicemotion", onMotion);
  return motionOK;
}

/* ---------------- wake lock ---------------- */
let lock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator) lock = await navigator.wakeLock.request("screen");
    else if (lock) { lock.release(); lock = null; }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && phase !== "home" && phase !== "results") keepAwake(true);
});

/* ---------------- round ---------------- */
let phase = "home", deck = null, queue = [], card = null, results = [];
let armed = false, judging = false, inPos = 0, tEnd = 0, tPhase = 0, raf = 0;

function show(id) {
  ["home", "play", "results"].forEach((s) => $(s).classList.toggle("on", s === id));
}
function setStage(html) { $("stagebody").innerHTML = html; }

async function startRound(d) {
  deck = d;
  queue = d.cards.slice().sort(() => Math.random() - 0.5);
  results = []; card = null; judging = false; armed = false; inPos = 0;
  await askMotion();
  document.body.classList.toggle("taps", !motionOK);
  $("clock").textContent = "";
  phase = "ready"; tPhase = performance.now();
  show("play"); keepAwake(true);
  setStage('<div><div class="big">Hold it to your forehead</div><div class="sub">' +
           (motionOK ? "Sideways, screen facing out" : "Tap anywhere to start") + "</div></div>");
  if (!raf) raf = requestAnimationFrame(tick);
}

function enter(p) {
  phase = p; tPhase = performance.now();
  if (p === "count") { setStage('<div class="count">3</div>'); beep(true); }
  if (p === "play") {
    tEnd = performance.now() + roundLen * 1000;
    armed = false; nextCard();
  }
  if (p === "up") { setStage('<div class="big">Time’s up</div>'); $("clock").textContent = ""; beep(false); }
}

function nextCard() {
  if (!queue.length) { enter("up"); return; }
  card = queue.shift();
  setStage('<div class="word"></div>');
  $("stagebody").firstChild.textContent = card.word;
}

function judge(ok) {
  if (phase !== "play" || judging || !card) return;
  judging = true; armed = false;
  results.push({ card: card, ok: ok });
  document.body.classList.add(ok ? "flash-ok" : "flash-no");
  setStage('<div class="big">' + (ok ? "Correct" : "Pass") + "</div>");
  beep(ok);
  setTimeout(() => {
    document.body.classList.remove("flash-ok", "flash-no");
    judging = false;
    if (phase === "play") nextCard();
  }, 680);
}

function tick(now) {
  raf = requestAnimationFrame(tick);
  if (phase === "ready") {
    // Permission granted but no sensor ever reports (desktop, odd hardware):
    // don't strand the player on this screen — offer the taps instead.
    if (motionOK && !haveMotion && now - tPhase > 4000) {
      motionOK = false;
      document.body.classList.add("taps");
      const s = $("stagebody").querySelector(".sub");
      if (s) s.textContent = "Tap anywhere to start";
    }
    if (motionOK && haveMotion) {
      const ready = Math.abs(nx) > 0.8 && Math.abs(nz) < 0.35;
      if (ready) { if (!inPos) inPos = now; if (now - inPos > 600) enter("count"); }
      else {
        inPos = 0;
        const portraitUp = Math.abs(nz) < 0.35 && Math.abs(nx) <= 0.8;
        const want = portraitUp ? "Turn the phone sideways" : "Hold it to your forehead";
        const el = $("stagebody").querySelector(".big");
        if (el && el.textContent !== want) el.textContent = want;
      }
    }
  } else if (phase === "count") {
    const left = 3 - Math.floor((now - tPhase) / 1000);
    if (left <= 0) enter("play");
    else {
      const el = $("stagebody").querySelector(".count");
      if (el && el.textContent !== String(left)) { el.textContent = String(left); beep(true); }
    }
  } else if (phase === "play") {
    const secs = Math.max(0, Math.ceil((tEnd - now) / 1000));
    if ($("clock").textContent !== String(secs)) $("clock").textContent = String(secs);
    if (secs === 0) { enter("up"); return; }
    if (!judging && motionOK && haveMotion) {
      if (armed) {
        const dir = nz > TRIG ? 1 : (nz < -TRIG ? -1 : 0);
        if (!dir) { tiltDir = 0; }
        else if (dir !== tiltDir) { tiltDir = dir; tiltSince = now; }
        else if (now - tiltSince > DWELL) { tiltDir = 0; judge(dir > 0); }
      } else if (Math.abs(nz) < REARM) { armed = true; tiltDir = 0; }
    }
  } else if (phase === "up") {
    if (now - tPhase > 1400) finish(true);
  }
}

function finish(toResults) {
  cancelAnimationFrame(raf); raf = 0;
  keepAwake(false);
  document.body.classList.remove("flash-ok", "flash-no", "taps");
  const score = results.filter((r) => r.ok).length;
  if (!toResults || !results.length) { phase = "home"; show("home"); return; }
  phase = "results";
  $("fscore").textContent = String(score);
  $("fcap").textContent = deck.name + " · " + score + " of " + results.length;
  const isBest = score > (best[deck.name] || 0) && score > 0;
  if (isBest) { best[deck.name] = score; store.set(KEY_BEST, best); }
  $("fbest").classList.toggle("hidden", !isBest);

  const list = $("rlist"); list.textContent = "";
  results.forEach((r) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "row";
    const nm = document.createElement("span");
    nm.className = "rname"; nm.textContent = r.card.word;
    const sv = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    sv.setAttribute("viewBox", "0 0 24 24"); sv.setAttribute("class", "mk");
    sv.setAttribute("stroke", r.ok ? "#127A3E" : "#B4611F");
    sv.innerHTML = r.ok ? '<path d="M5 13l4 4L19 7"/>' : '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>';
    b.append(nm, sv);
    b.addEventListener("click", () => openSheet(r.card));
    list.appendChild(b);
  });
  show("results"); paint();
}

function openSheet(c) {
  $("sword").textContent = c.word;
  $("sinfo").textContent = c.info;
  $("sclues").textContent = (c.clues || []).join(" · ");
  $("ssteps").classList.add("hidden");
  $("sclues").classList.remove("hidden");
  $("sheet").classList.add("on");
}

const HELP =
  '<div class="shead">ON IPHONE</div>' +
  "<ol id=\"ol1\">" +
  "<li>Turn the phone <b>sideways</b>.</li>" +
  "<li>Tap the small <b>lines icon</b> just to the left of the web address.</li>" +
  "<li>Choose <b>Hide Toolbar</b> — the one with two arrows pointing away from each other.</li>" +
  "</ol>" +
  '<div class="shead">EVEN BETTER — NO BROWSER AT ALL</div>' +
  "<ol>" +
  "<li>iPhone: <b>Share</b> → <b>Add to Home Screen</b>.</li>" +
  "<li>Android: <b>⋮</b> menu → <b>Add to Home screen</b>.</li>" +
  "<li>Open Ramza from your home screen — it runs full screen with its own icon, and works without signal.</li>" +
  "</ol>";

function openHelp() {
  $("sword").textContent = "Playing full screen";
  $("sinfo").textContent = "The browser bars steal room from the word and can catch your fingers mid-round. Two ways to get rid of them:";
  $("ssteps").innerHTML = HELP;
  $("ssteps").classList.remove("hidden");
  $("sclues").classList.add("hidden");
  $("sheet").classList.add("on");
}
$("fshelp").addEventListener("click", openHelp);
$("sclose").addEventListener("click", () => $("sheet").classList.remove("on"));
$("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("sheet").classList.remove("on"); });

$("quit").addEventListener("click", () => finish(results.length > 0));
$("again").addEventListener("click", () => startRound(deck));
$("back").addEventListener("click", () => { phase = "home"; show("home"); });
$("tapok").addEventListener("click", () => { if (phase === "play") judge(true); else if (phase === "ready") enter("count"); });
$("tapno").addEventListener("click", () => { if (phase === "play") judge(false); else if (phase === "ready") enter("count"); });
$("stage").addEventListener("click", () => { if (phase === "ready" && !motionOK) enter("count"); });

paintSeg();
loadCards();
</script>
</body>
</html>
